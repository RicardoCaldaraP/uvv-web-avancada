<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UVV — Estudos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand" id="brand" data-nav="subjects">UVV <span>Estudos</span></div>
    <div class="crumbs" id="crumbs"></div>
    <nav id="topnav"></nav>
  </header>

  <!-- ESCOLHA DE MATÉRIA -->
  <section class="page active" data-page="subjects">
    <div class="subjects-wrap">
      <h1>Qual matéria?</h1>
      <p class="lead">Cada matéria tem suas próprias aulas em slides e um banco de questões separado por unidade.</p>
      <div class="subject-grid" id="subjectGrid"></div>
    </div>
  </section>

  <!-- HOME DA MATÉRIA -->
  <section class="page" data-page="subject-home">
    <div class="home">
      <h1 id="subjectTitle"></h1>
      <p class="subtitle" id="subjectDesc"></p>

      <h2>Aulas</h2>
      <div class="unit-list" id="unitList"></div>

      <h2>Praticar</h2>
      <p class="subtitle" style="margin-bottom:20px; font-size:16px;">Questões separadas por unidade (e simulado de prova, quando disponível).</p>
      <div class="action-row">
        <button class="primary" data-nav="questoes">Ir para Questões →</button>
      </div>
    </div>
  </section>

  <!-- AULA -->
  <section class="page" data-page="aula">
    <div class="slide-progress"><div class="fill" id="slideProgress"></div></div>
    <div class="slide-meta" id="slideMeta"></div>

    <div class="slides-wrap">
      <div class="slide" id="slideContainer"></div>
    </div>

    <!-- Menu de tópicos (dropdown) -->
    <div class="slide-index" id="slideIndex">
      <div class="slide-index-header">
        <span>Tópicos desta aula</span>
        <button id="closeIndex" aria-label="Fechar">×</button>
      </div>
      <ol class="slide-index-list" id="slideIndexList"></ol>
    </div>
    <div class="slide-index-backdrop" id="slideIndexBackdrop"></div>

    <div class="slide-nav">
      <button class="exit" data-nav="subject-home">← Sair</button>
      <div class="center-info">
        <button class="index-btn" id="openIndex" title="Ver todos os tópicos (T)">
          <span>≡</span> <span id="slideCounter"></span>
        </button>
      </div>
      <div class="slide-nav-right">
        <button id="slidePrev" title="Anterior (←)">‹</button>
        <button id="slideNext" title="Próximo (→)">›</button>
      </div>
    </div>
  </section>

  <!-- QUESTÕES -->
  <section class="page" data-page="questoes">
    <div class="questoes-wrap">
      <h1 id="questoesTitle">Questões</h1>
      <p class="lead" id="questoesLead"></p>

      <div class="unit-tabs" id="unitTabs"></div>

      <div id="questoesContent"></div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/data-ed2.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
